# Local development for Aidoku: Postgres, plus the content-serving REST
# API (book-content/) that reads from it. Not for production use — see
# README Milestones for what's actually built vs. designed.
#
# `docker compose up -d` on first run creates the "aidoku_pgdata" named
# volume and applies db/schema.sql automatically (Postgres only runs
# files under docker-entrypoint-initdb.d against a *fresh* data
# directory). Every run after that reuses the same volume, so data
# persists across `docker compose down` / restarts / reboots. Only
# `docker compose down -v` (or deleting the volume explicitly) discards
# it — normal `down`/`up` does not.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aidoku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidoku_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aidoku}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aidoku_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidoku} -d ${POSTGRES_DB:-aidoku}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The Flutter app's backend — read-only, serves book/chunk/question/
  # breakdown as JSON over /aidoku/... (see book-content/internal/api).
  # Build context is the repo root, not book-content/, because this
  # module resolves aidoku/shared via go.work — see
  # book-content/Dockerfile's own comment.
  book-content:
    build:
      context: .
      dockerfile: book-content/Dockerfile
    restart: unless-stopped
    environment:
      # POSTGRES_HOST/PORT deliberately don't reuse the host-facing
      # POSTGRES_PORT var above — inside the compose network this
      # container reaches postgres by service name on its *container*
      # port (always 5432), regardless of whatever host port that
      # service happens to publish to.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aidoku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidoku_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aidoku}
    ports:
      - "${BOOK_CONTENT_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aidoku_pgdata:
